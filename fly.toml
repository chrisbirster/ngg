app = "ngg"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ADDR = ":8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
